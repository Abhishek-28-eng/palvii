# ─── HTTP → redirect to HTTPS ─────────────────────────────────────────────────
server {
  listen 80;
  server_name palvii.devwithabhi.de api.devwithabhi.de;

  # Certbot challenge (needed for first-time cert issue)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── Frontend: palvii.devwithabhi.de ─────────────────────────────────────────
server {
  listen 443 ssl;
  server_name palvii.devwithabhi.de;

  ssl_certificate     /etc/letsencrypt/live/palvii.devwithabhi.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/palvii.devwithabhi.de/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  location / {
    proxy_pass         http://palvii_frontend:80;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

# ─── Backend API: api.devwithabhi.de ─────────────────────────────────────────
server {
  listen 443 ssl;
  server_name api.devwithabhi.de;

  ssl_certificate     /etc/letsencrypt/live/palvii.devwithabhi.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/palvii.devwithabhi.de/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  location / {
    proxy_pass         http://palvii_backend:5000;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
