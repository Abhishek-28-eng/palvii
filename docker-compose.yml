version: '3.8'

services:
  # ── MySQL Database ────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: palvii_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-palvii_db}
      MYSQL_USER: ${DB_USER:-palvii}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - palvii_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_USERNAME}/palvii-backend:latest
    container_name: palvii_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-palvii_db}
      DB_USER: ${DB_USER:-palvii}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PALVII_WHATSAPP_NUMBER: ${PALVII_WHATSAPP_NUMBER}
      FRONTEND_URL: https://palvii.devwithabhi.de
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - palvii_net

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_USERNAME}/palvii-frontend:latest
    container_name: palvii_frontend
    restart: unless-stopped
    networks:
      - palvii_net

  # ── Nginx Reverse Proxy + SSL ─────────────────────────────────────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: palvii_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - palvii_net

  # ── Certbot (Let's Encrypt) ───────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: palvii_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: >
      certonly --webroot --webroot-path=/var/www/certbot
      --email abhishektalole47@gmail.com
      --agree-tos --no-eff-email
      -d palvii.devwithabhi.de
      -d api.devwithabhi.de

volumes:
  mysql_data:
  backend_uploads:
  certbot_certs:
  certbot_www:

networks:
  palvii_net:
    driver: bridge
